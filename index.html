<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 AI Prompt 智能寶庫</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Microsoft JhengHei', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#0070f3',
                            600: '#0061d5',
                            700: '#004eba',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar inside cards */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="bg-slate-950 min-h-screen font-sans text-slate-100 antialiased pb-12">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 right-5 transform translate-y-[-100px] opacity-0 transition-all duration-300 bg-brand-600 text-white px-5 py-3 rounded-xl shadow-2xl z-50 flex items-center space-x-3 pointer-events-none">
        <i class="fa-solid font-bold text-emerald-300 fa-circle-check text-xl"></i>
        <span id="toast-message" class="font-medium text-sm">複製成功！</span>
    </div>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8">

        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight flex items-center justify-center gap-3 mb-2">
                🚀 AI Prompt 智能寶庫
            </h1>
            <a href="https://docs.google.com/spreadsheets/d/1oKvF9Hb0OQ9uCMI-BiWwfi6VG4ZftFkLY8-RVa9_9fM/edit?gid=1480282197#gid=1480282197" 
               target="_blank" 
               class="inline-flex items-center text-sm font-medium text-slate-400 hover:text-brand-500 transition-colors">
                <i class="fa-regular fa-file-excel mr-1.5 text-emerald-400"></i>
                開啟原始資料 Google Sheet
            </a>
        </header>

        <!-- Search Bar -->
        <div class="max-w-2xl mx-auto mb-8 relative">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                <input type="text" 
                       id="search-input" 
                       placeholder="搜尋提示詞內容、名稱或標籤..." 
                       class="w-full pl-11 pr-10 py-3.5 bg-slate-900 rounded-full border border-slate-800 text-white placeholder-slate-500 shadow-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all text-sm sm:text-base">
                <button id="clear-search" class="hidden absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </div>

        <!-- Filter Tags -->
        <div class="flex flex-wrap items-center justify-center gap-2 mb-10 max-w-4xl mx-auto" id="tag-container">
            <!-- Dynamic tags generated by JS -->
        </div>

        <!-- Section Title -->
        <div class="flex items-center justify-between mb-6 pb-2 border-b border-slate-800">
            <h2 class="text-xl font-bold text-slate-100 flex items-center gap-2">
                <span>🧠</span> AI 協思
            </h2>
            <span id="prompt-count" class="text-xs font-semibold px-2.5 py-1 bg-slate-800 text-slate-400 rounded-full">
                共 0 個提示詞
            </span>
        </div>

        <!-- Prompts Grid -->
        <div id="prompts-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Cards will be populated by JavaScript -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-16 bg-slate-900 rounded-2xl border border-dashed border-slate-800">
            <div class="text-4xl mb-3">🔍</div>
            <h3 class="text-lg font-bold text-slate-300">未找到相關提示詞</h3>
            <p class="text-slate-500 text-sm mt-1">請嘗試變更搜尋關鍵字或選擇其他分類標籤。</p>
            <button onclick="resetFilters()" class="mt-4 px-4 py-2 bg-brand-500 text-white text-sm font-medium rounded-lg hover:bg-brand-600 transition-colors">
                重設篩選條件
            </button>
        </div>

    </div>

    <!-- Script JavaScript -->
    <script>
        // Preset Prompt Data from Spreadsheet & Screenshot
        const promptData = [
            {
                id: 1,
                title: "意義單詞",
                category: "內容創作",
                content: `將文章的重點部分，尋找一個代表性英文字母，並使這些字母的首字組合合成一個具有意義的單詞（如「VISION」）`
            },
            {
                id: 2,
                title: "品牌名稱",
                category: "內容創作",
                content: `完成 ChatGPT 角色定義後，依據"品牌定義"與"產品介紹"發想5個產品名稱與標題（口號）。
- 提示詞指令：描述品牌與產品，請列出 5 個產品名稱與行銷標題建議。（"品牌定義"描述、"產品介紹"描述）
- Prompt:
- 我修出一個運動鞋品牌，今年會銷售一款新型跑步`
            },
            {
                id: 3,
                title: "長篇文章",
                category: "筆記精煉",
                content: `為這篇長篇文章，進行以下四個步驟，每一個步驟都要提供給文章與標示出來：
第1、請為這篇長文件生成一份簡短摘要。
第2、請基於上一個摘要，不要遺漏任何專有名詞、數字或關鍵人物，重新生成一份摘要。
第3、現在，請將摘要中每一句話都濃縮成更簡潔的表達，同時保留`
            },
            {
                id: 4,
                title: "書籍精煉",
                category: "筆記精煉",
                content: `請對 @[檔名]
啟動【終極煉金管線】，一次執行四步驟整合：
第一步：全域架構導航 (Stage 01)
執行 stage-1-navigator，對精煉稿進行深度掃描，產出知識地圖與反直覺預警。
存檔：01_Map_[主題簡稱].md。
第二步：價值 DNA 診斷 (Stage 02)`
            },
            {
                id: 5,
                title: "書籍精煉 (實戰版)",
                category: "筆記精煉",
                content: `請對輸入書籍內容啟動深度摘要模組：
1. 提煉核心觀點與論證結構。
2. 標註反直覺的核心洞察與實用工具。
3. 輸出包含心智圖文字大綱與條列式學習重點。`
            },
            {
                id: 6,
                title: "提取練習",
                category: "筆記精煉",
                content: `我剛讀完了關於 [填入具體段落標題] 的內容。現在請幫我進行深度研磨：

1-底層邏輯拷問：針對這段內容的「運作原理」向我提問，測試我是否理解了「為什麼有效」，而非只是記住步驟。

2-隱喻轉化：如果這段概念有複雜`
            },
            {
                id: 7,
                title: "影片清理",
                category: "內容創作",
                content: `你的角色是一位「逐字稿校對員」，不是編輯。
任務：
1-僅刪除口語填充詞、重複說法、明顯冗詞
2-不得改寫句型、不得改變原意、不得加入新解釋
規則：
1-原句順序必須完全一致
2-若刪除任何詞語，需確保前後前`
            },
            {
                id: 8,
                title: "影片清理 (結構化)",
                category: "內容創作",
                content: `你的角色是一位「內容結構化整理員」，不是編輯、不是評論者。

我會提供一段約 4000 字的影片文文字內容，請你在完全保留作者語意與立場的前提下，
進行「保留語意的濃縮」，將內容壓縮至約 2000 字。全文用繁體中文呈現。`
            },
            {
                id: 9,
                title: "簡報結構化生成",
                category: "簡報表達",
                content: `請幫我將以下文章轉化為 10 頁簡報大綱（Slide Deck Outline）。
每頁簡報格式需包含：
- [頁碼] 標題
- 核心觀點 (單一重點)
- 建議視覺元素/圖表類型
- 講者備忘錄關鍵字`
            },
            {
                id: 10,
                title: "Python 數據處理腳本",
                category: "程式生成",
                content: `你是一位資深 Python 工程師。請撰寫一個程式碼腳本：
1. 讀取指定 CSV 檔案
2. 進行數據清理（處理缺失值、去除重複項）
3. 計算相關統計指標並將結果輸出為 JSON 格式。
請包含完整的 try-except 錯誤處理機制與詳細註解。`
            },
            {
                id: 11,
                title: "商務 Email 語氣優化",
                category: "文本優化",
                content: `請幫我修改這封電子郵件，使其語氣更加專業、客氣但堅定。
目標：向客戶說明專案需要延期一週，並提出新的里程碑時程與配套解決方案，以消除客戶的疑慮。`
            },
            {
                id: 12,
                title: "心智圖框架構建",
                category: "心智圖法",
                content: `請針對主題 [輸入主題] 建立一個階層清晰的心智圖結構。
使用 PlantUML 或 Markdown 樹狀結構呈現，確保涵蓋：
- 核心概念 (Central Idea)
- 4個主要分支 (Main Branches)
- 每個主分支下拓展 3 個子分支 (Sub-branches)`
            }
        ];

        // Categories List
        const categories = [
            "全部", "內容創作", "筆記精煉", "程式應用", "簡報表達", 
            "程式生成", "文本優化", "生文校正", "專案企劃", 
            "圖片生成", "筆記整理", "資訊整理", "心智圖法"
        ];

        let selectedCategory = "全部";
        let searchQuery = "";

        // DOM Elements
        const tagContainer = document.getElementById('tag-container');
        const promptsGrid = document.getElementById('prompts-grid');
        const searchInput = document.getElementById('search-input');
        const clearSearchBtn = document.getElementById('clear-search');
        const emptyState = document.getElementById('empty-state');
        const promptCount = document.getElementById('prompt-count');

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            renderCategoryTags();
            filterAndRenderPrompts();

            // Search Event Listener
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.trim().toLowerCase();
                if (searchQuery) {
                    clearSearchBtn.classList.remove('hidden');
                } else {
                    clearSearchBtn.classList.add('hidden');
                }
                filterAndRenderPrompts();
            });

            // Clear Search Button
            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                searchQuery = '';
                clearSearchBtn.classList.add('hidden');
                filterAndRenderPrompts();
            });
        });

        // Render Tags
        function renderCategoryTags() {
            tagContainer.innerHTML = '';
            categories.forEach(cat => {
                const button = document.createElement('button');
                button.className = `px-4 py-2 rounded-full text-xs font-semibold transition-all duration-200 border ${
                    selectedCategory === cat 
                        ? 'bg-brand-500 text-white border-brand-500 shadow-md shadow-brand-500/30 scale-105' 
                        : 'bg-slate-900 text-slate-400 border-slate-800 hover:bg-slate-800 hover:text-slate-200'
                }`;
                button.textContent = cat;
                button.onclick = () => {
                    selectedCategory = cat;
                    renderCategoryTags();
                    filterAndRenderPrompts();
                };
                tagContainer.appendChild(button);
            });
        }

        // Filter & Render Cards
        function filterAndRenderPrompts() {
            const filtered = promptData.filter(item => {
                const matchesCategory = selectedCategory === "全部" || item.category === selectedCategory;
                const matchesSearch = !searchQuery || 
                    item.title.toLowerCase().includes(searchQuery) ||
                    item.content.toLowerCase().includes(searchQuery) ||
                    item.category.toLowerCase().includes(searchQuery);
                return matchesCategory && matchesSearch;
            });

            promptCount.textContent = `共 ${filtered.length} 個提示詞`;

            if (filtered.length === 0) {
                promptsGrid.classList.add('hidden');
                emptyState.classList.remove('hidden');
            } else {
                promptsGrid.classList.remove('hidden');
                emptyState.classList.add('hidden');
                renderCards(filtered);
            }
        }

        // Render Prompt Cards HTML
        function renderCards(items) {
            promptsGrid.innerHTML = items.map(item => `
                <div class="bg-slate-900 rounded-2xl border border-slate-800/80 shadow-md hover:shadow-xl hover:border-slate-700 transition-all duration-200 flex flex-col justify-between overflow-hidden group">
                    <div class="p-5 flex-1 flex flex-col">
                        <!-- Category Badge -->
                        <div class="mb-2">
                            <span class="inline-block px-2.5 py-1 text-[11px] font-bold text-brand-400 bg-brand-950/80 border border-brand-800/40 rounded-md">
                                ${escapeHtml(item.category)}
                            </span>
                        </div>
                        
                        <!-- Title -->
                        <h3 class="text-lg font-bold text-slate-100 mb-3 group-hover:text-brand-400 transition-colors">
                            ${escapeHtml(item.title)}
                        </h3>
                        
                        <!-- Content Box -->
                        <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800/80 flex-1 overflow-y-auto max-h-44 custom-scrollbar text-xs sm:text-sm text-slate-300 leading-relaxed font-sans whitespace-pre-wrap select-text">
                            ${escapeHtml(item.content)}
                        </div>
                    </div>

                    <!-- Action Button -->
                    <div class="p-4 pt-0">
                        <button onclick="copyToClipboard(\`${escapeForAttribute(item.content)}\`)" 
                                class="w-full py-2.5 px-4 bg-brand-500 hover:bg-brand-600 active:scale-[0.98] text-white font-medium text-xs sm:text-sm rounded-xl shadow-md transition-all flex items-center justify-center space-x-2">
                            <i class="fa-regular fa-copy"></i>
                            <span>複製 Prompt</span>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Copy to Clipboard Strategy (Compliant with restricted environments)
        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast('提示詞已複製到剪貼簿！');
                } else {
                    showToast('複製失敗，請手動複製');
                }
            } catch (err) {
                showToast('複製失敗：' + err);
            }
            
            document.body.removeChild(textarea);
        }

        // Show Toast Function
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            toastMessage.textContent = msg;

            toast.classList.remove('opacity-0', 'translate-y-[-100px]', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-[-100px]', 'pointer-events-none');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 2500);
        }

        // Reset All Filters
        function resetFilters() {
            selectedCategory = "全部";
            searchQuery = "";
            searchInput.value = '';
            clearSearchBtn.classList.add('hidden');
            renderCategoryTags();
            filterAndRenderPrompts();
        }

        // Utility: Escape HTML
        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }

        // Utility: Escape for JS string parameters inside HTML attributes
        function escapeForAttribute(str) {
            return str
                .replace(/\\/g, '\\\\')
                .replace(/`/g, '\\`')
                .replace(/\$/g, '\\$')
                .replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
